name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create release draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  checks: write
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install vsce globally
        run: bun add -g @vscode/vsce

      - name: Install dependencies
        run: bun install

      - name: Build extension (type-check, lint, bundle)
        run: bun run package

      - name: Create VSIX package
        run: bun run package:vsix

      - name: Capture VSIX filename
        id: vsix
        run: |
          VSIX_FILE=$(ls -1 *.vsix | head -n 1)
          if [ -z "$VSIX_FILE" ]; then
            echo "VSIX package not found" >&2
            exit 1
          fi
          echo "file=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "VSIX file: $VSIX_FILE"

      - name: Upload VSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustedwarfare-mod-support
          path: ${{ steps.vsix.outputs.file }}

      - name: Extract version from package.json
        if: github.event.inputs.create_release == 'true'
        id: extract_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: v$VERSION"

      - name: Create Release Draft
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: Release v${{ steps.extract_version.outputs.version }}
          draft: true
          prerelease: false
          files: ${{ steps.vsix.outputs.file }}
          body: |
            ## What's Changed

            ### Features
            - 

            ### Bug Fixes
            - 

            ### Other Changes
            - 

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/...

            ## Installation

            1. Download the `.vsix` file from the assets below
            2. Open VS Code
            3. Run command: `Extensions: Install from VSIX...`
            4. Select the downloaded file

            Or install via command line:
            ```bash
            code --install-extension rustedwarfaremodsupport-${{ steps.extract_version.outputs.version }}.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
